<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <base target="_top">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>公版會計系統</title>
  <style>
  :root {
    --bg: #f5f6f4;
    --surface: #ffffff;
    --ink: #1d2826;
    --muted: #61706c;
    --line: #e1e5e2;
    --line-strong: #c9d0cc;
    --primary: #0f6e66;
    --primary-ink: #ffffff;
    --primary-soft: #e3f1ee;
    --danger: #b42318;
    --danger-soft: #fdecea;
    --warn: #9a5b00;
    --warn-soft: #fff4dc;
    --good: #1d7a3e;
    --good-soft: #e5f4ea;
    --radius: 10px;
    --font: "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", system-ui, sans-serif;
    --mono: "SF Mono", "Roboto Mono", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; overflow-x: hidden; }
  body { background: var(--bg); color: var(--ink); font: 15px/1.55 var(--font); -webkit-text-size-adjust: 100%; }
  [hidden] { display: none !important; }
  h1, h2, h3 { margin: 0; line-height: 1.3; }
  h2 { font-size: 20px; }
  h3 { font-size: 16px; margin: 18px 0 8px; }
  a { color: var(--primary); }
  .muted { color: var(--muted); }
  .small { font-size: 13px; }
  .num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .neg { color: var(--danger); }
  .code { font-family: var(--mono); font-size: 13px; }
  .error-text { color: var(--danger); white-space: pre-line; min-height: 1.2em; margin: 8px 0 0; }

  /* 按鈕與表單 */
  .btn { appearance: none; border: 1px solid var(--line-strong); background: var(--surface); color: var(--ink); border-radius: 8px; padding: 8px 14px; font: inherit; cursor: pointer; white-space: nowrap; }
  .btn:hover { border-color: var(--primary); }
  .btn:focus-visible, .icon-btn:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 2px solid var(--primary); outline-offset: 1px; }
  .btn.primary { background: var(--primary); border-color: var(--primary); color: var(--primary-ink); }
  .btn.danger { color: var(--danger); border-color: #f1b5ae; }
  .btn.ghost { background: transparent; }
  .btn.small { padding: 4px 10px; font-size: 13px; }
  .btn.block { width: 100%; }
  .btn:disabled { opacity: .5; cursor: not-allowed; }
  .icon-btn { appearance: none; border: 0; background: transparent; font-size: 20px; line-height: 1; padding: 6px 8px; border-radius: 8px; cursor: pointer; color: inherit; }
  input, select, textarea { font: inherit; color: var(--ink); background: var(--surface); border: 1px solid var(--line-strong); border-radius: 8px; padding: 7px 10px; min-width: 0; width: 100%; }
  input[type="checkbox"] { width: auto; }
  input.num { text-align: right; }
  label { display: block; font-size: 13px; color: var(--muted); }
  label > input, label > select, label > textarea { margin-top: 4px; }
  .row { display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-end; }
  .row > * { min-width: 0; }
  .row .grow { flex: 1 1 200px; }
  .field { flex: 0 1 170px; }
  .check { display: inline-flex; align-items: center; gap: 6px; color: var(--ink); font-size: 14px; margin-right: 14px; }

  /* 登入 */
  .login { min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; }
  .login-card { width: 100%; max-width: 360px; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 28px 24px; display: grid; gap: 12px; }
  .login-card h1 { font-size: 22px; }
  .login-card p { margin: 0; }
  .brand-mark { width: 44px; height: 44px; border-radius: 12px; background: var(--primary); color: #fff; display: grid; place-items: center; font-weight: 700; font-size: 20px; }

  /* 主框架 */
  .topbar { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 12px; padding: 10px 20px; background: var(--surface); border-bottom: 1px solid var(--line); }
  .topbar h1 { font-size: 17px; flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .who { display: flex; align-items: center; gap: 8px; font-size: 14px; min-width: 0; }
  .role-tag { background: var(--primary-soft); color: var(--primary); border-radius: 999px; padding: 2px 10px; font-size: 12px; white-space: nowrap; }
  .menu-btn { display: none; }
  .topbar { border-top: 4px solid var(--co, var(--primary)); }
  .co-switch { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .co-switch select { width: auto; max-width: 260px; font-weight: 600; border-color: var(--co, var(--primary)); padding: 6px 10px; }
  .co-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--co, var(--primary)); flex: 0 0 10px; }
  .co-label { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); }
  .co-label .co-dot { display: inline-block; }
  .tpl-bar { display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-end; padding: 12px; background: var(--bg); border-radius: 8px; margin-bottom: 12px; }
  .access-grid { display: grid; grid-template-columns: minmax(0, 1fr) 140px; gap: 8px 12px; align-items: center; margin-top: 8px; }
  .layout { display: flex; min-height: calc(100vh - 57px); background: linear-gradient(to right, var(--surface) 210px, var(--line) 210px, var(--line) 211px, transparent 211px); }
  .nav { flex: 0 0 211px; background: var(--surface); border-right: 1px solid var(--line); padding: 14px 10px 40px; position: sticky; top: 57px; align-self: flex-start; max-height: calc(100vh - 57px); overflow-y: auto; }
  .nav-group { font-size: 12px; color: var(--muted); padding: 14px 10px 6px; letter-spacing: .04em; }
  .nav a { display: block; padding: 8px 12px; border-radius: 8px; color: var(--ink); text-decoration: none; }
  .nav a:hover { background: var(--bg); }
  .nav a.active { background: var(--primary-soft); color: var(--primary); font-weight: 600; }
  .main { flex: 1 1 auto; min-width: 0; padding: 22px 28px 60px; outline: none; }
  .page-head { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; margin-bottom: 16px; }
  .page-head h2 { flex: 1 1 auto; }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; margin-bottom: 14px; min-width: 0; }
  .toolbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-end; margin-bottom: 14px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { border: 1px solid var(--line-strong); background: var(--surface); border-radius: 999px; padding: 4px 12px; font-size: 13px; cursor: pointer; font: inherit; font-size: 13px; }
  .chip.on { background: var(--primary); color: #fff; border-color: var(--primary); }

  /* KPI */
  .kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; margin-bottom: 14px; }
  .kpi { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; min-width: 0; }
  .kpi .label { font-size: 13px; color: var(--muted); }
  .kpi .value { font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; margin-top: 4px; overflow-wrap: anywhere; }
  .kpi .sub { font-size: 12px; color: var(--muted); margin-top: 2px; }

  /* 提示 */
  .notice { border-radius: var(--radius); padding: 12px 14px; margin-bottom: 14px; border: 1px solid; }
  .notice.warn { background: var(--warn-soft); border-color: #f0d49a; color: var(--warn); }
  .notice.bad { background: var(--danger-soft); border-color: #f1b5ae; color: var(--danger); }
  .notice.good { background: var(--good-soft); border-color: #b5dcc2; color: var(--good); }
  .notice.info { background: var(--primary-soft); border-color: #b9dcd5; color: #0b4f49; }
  .badge { display: inline-block; border-radius: 999px; padding: 1px 9px; font-size: 12px; white-space: nowrap; }
  .badge.void { background: var(--danger-soft); color: var(--danger); }
  .badge.lock { background: #eceff1; color: #455a64; }
  .badge.open { background: var(--good-soft); color: var(--good); }
  .badge.auto { background: var(--warn-soft); color: var(--warn); }
  .steps { margin: 0; padding-left: 20px; }
  .steps li { margin: 6px 0; }
  .steps li.done { color: var(--muted); text-decoration: line-through; }

  /* 表格 */
  .table-wrap { width: 100%; overflow-x: auto; -webkit-overflow-scrolling: touch; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { padding: 8px 10px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
  th { font-size: 13px; color: var(--muted); font-weight: 600; background: #fafbfa; white-space: nowrap; }
  tr.subtotal td { font-weight: 600; background: #fafbfa; }
  tr.total td { font-weight: 700; border-top: 2px solid var(--ink); border-bottom: 3px double var(--ink); }
  tr.section td { font-weight: 700; padding-top: 14px; border-bottom: 1px solid var(--line-strong); }
  tr.void td { color: var(--muted); text-decoration: line-through; }
  td.indent { padding-left: 24px; }
  td.actions { text-align: right; white-space: nowrap; }
  .report-title { text-align: center; margin-bottom: 12px; }
  .report-title .co { font-size: 18px; font-weight: 700; }
  .report-title .rng { color: var(--muted); font-size: 13px; }

  /* 傳票 */
  .voucher { border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); margin-bottom: 10px; }
  .voucher-head { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; padding: 10px 14px; cursor: pointer; }
  .voucher-head .no { font-family: var(--mono); font-weight: 600; }
  .voucher-head .memo { flex: 1 1 160px; min-width: 0; overflow-wrap: anywhere; }
  .voucher-body { border-top: 1px solid var(--line); padding: 6px 14px 12px; }
  .voucher-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 8px; flex-wrap: wrap; }

  .lines { display: grid; gap: 8px; }
  .line { display: grid; grid-template-columns: minmax(0, 2.2fr) minmax(0, 1fr) minmax(0, 1fr) minmax(0, 1.6fr) minmax(0, 1.1fr) 36px; gap: 8px; align-items: center; }
  .line.head { font-size: 12px; color: var(--muted); }
  .line .acct-name { font-size: 12px; color: var(--muted); margin-top: 2px; min-height: 1em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .line-totals { display: flex; justify-content: flex-end; gap: 18px; font-variant-numeric: tabular-nums; padding: 8px 4px 0; flex-wrap: wrap; }
  .diff-ok { color: var(--good); font-weight: 600; }
  .diff-bad { color: var(--danger); font-weight: 600; }

  /* 對話框與通知 */
  .modal { position: fixed; inset: 0; background: rgba(20, 30, 28, .45); z-index: 50; display: flex; align-items: flex-start; justify-content: center; padding: 40px 16px; overflow-y: auto; }
  .modal-card { background: var(--surface); border-radius: 14px; width: 100%; max-width: 920px; box-shadow: 0 20px 60px rgba(0, 0, 0, .2); }
  .modal-card.narrow { max-width: 460px; }
  .modal-head { display: flex; align-items: center; justify-content: space-between; padding: 14px 18px; border-bottom: 1px solid var(--line); }
  .modal-head h2 { font-size: 18px; }
  .modal-body { padding: 16px 18px 20px; }
  .modal-foot { display: flex; justify-content: flex-end; gap: 10px; margin-top: 16px; flex-wrap: wrap; }
  .toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--ink); color: #fff; padding: 10px 18px; border-radius: 10px; z-index: 70; max-width: calc(100vw - 32px); white-space: pre-line; }
  .toast.bad { background: var(--danger); }
  .busy { position: fixed; inset: 0; z-index: 60; background: rgba(255, 255, 255, .45); display: grid; place-items: center; }
  .spinner { width: 34px; height: 34px; border: 3px solid var(--primary-soft); border-top-color: var(--primary); border-radius: 50%; animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .pw-box { font-family: var(--mono); font-size: 20px; letter-spacing: .06em; background: var(--bg); border: 1px dashed var(--line-strong); padding: 10px 14px; border-radius: 8px; text-align: center; user-select: all; }
  .help h3 { margin-top: 20px; }
  .help ol, .help ul { padding-left: 20px; }
  .help li { margin: 4px 0; }

  /* 平板 */
  @media (max-width: 1100px) {
    .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  }

  /* 手機 */
  @media (max-width: 860px) {
    .menu-btn { display: inline-block; }
    .topbar { flex-wrap: wrap; padding: 8px 12px; gap: 6px 10px; }
    .topbar h1 { flex: 1 1 calc(100% - 60px); font-size: 16px; }
    .who { flex: 1 1 60%; order: 3; }
    .app.multi .topbar h1 { display: none; }
    .co-switch { flex: 1 1 calc(100% - 120px); order: 1; }
    .co-switch select { max-width: none; width: 100%; }
    .menu-btn { order: 0; }
    #logoutBtn { order: 4; }
    .nav { position: fixed; top: 0; left: 0; bottom: 0; z-index: 40; width: 250px; height: 100vh; max-height: 100vh; overflow-y: auto; transform: translateX(-105%); transition: transform .2s; padding-top: 18px; }
    .nav.open { transform: none; box-shadow: 0 0 40px rgba(0, 0, 0, .2); }
    .layout { display: block; background: none; }
    .main { padding: 16px 16px 60px; }
    .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
    .kpi { padding: 12px; }
    .kpi .value { font-size: 18px; }
    .field { flex: 1 1 140px; }
    .line { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); padding: 10px; border: 1px solid var(--line); border-radius: 8px; }
    .line.head { display: none; }
    .line .acct { grid-column: 1 / -1; }
    .line .line-memo { grid-column: 1 / -1; }
    .line .line-del { justify-self: end; }
    .modal { padding: 0; }
    .modal-card { border-radius: 0; min-height: 100vh; }
    th, td { padding: 7px 8px; }
    .table-wrap > table { min-width: 560px; }
  }

  /* 列印：只印報表 */
  @media print {
    body { background: #fff; }
    .topbar, .nav, .toolbar, .no-print, .toast, .busy { display: none !important; }
    .main { padding: 0; }
    .card { border: 0; padding: 0; }
  }
</style>

</head>
<body>
  <!-- 登入 -->
  <section id="login" class="login" hidden>
    <form id="loginForm" class="login-card" autocomplete="on">
      <div class="brand-mark" aria-hidden="true">帳</div>
      <h1>公版會計系統</h1>
      <p class="muted">請輸入帳號密碼登入</p>
      <label>帳號<input id="loginUser" name="username" autocomplete="username" required></label>
      <label>密碼<input id="loginPass" name="password" type="password" autocomplete="current-password" required></label>
      <button class="btn primary block" type="submit" id="loginBtn">登入</button>
      <p id="loginMsg" class="error-text" role="alert"></p>
    </form>
  </section>

  <!-- 主畫面 -->
  <div id="app" class="app" hidden>
    <header class="topbar">
      <button class="icon-btn menu-btn" id="menuBtn" type="button" aria-label="開啟選單" aria-expanded="false">☰</button>
      <h1 id="companyTitle">公版會計系統</h1>
      <div class="co-switch" id="coWrap" hidden>
        <span class="co-dot" aria-hidden="true"></span>
        <select id="coSwitch" aria-label="切換公司"></select>
      </div>
      <div class="who"><span id="whoName"></span><span id="whoRole" class="role-tag"></span></div>
      <button class="btn ghost small" id="logoutBtn" type="button">登出</button>
    </header>
    <div class="layout">
      <nav id="nav" class="nav" aria-label="功能選單"></nav>
      <main id="main" class="main" tabindex="-1"></main>
    </div>
  </div>

  <!-- 對話框 -->
  <div id="modal" class="modal" hidden role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal-card">
      <div class="modal-head">
        <h2 id="modalTitle"></h2>
        <button class="icon-btn" id="modalClose" type="button" aria-label="關閉">✕</button>
      </div>
      <div id="modalBody" class="modal-body"></div>
    </div>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <div id="busy" class="busy" hidden><div class="spinner" aria-label="處理中"></div></div>

  <script>
(function () {
  'use strict';

  // ───────────── 狀態與工具 ─────────────
  var S = { token: null, boot: null, page: 'home', acctMap: {}, companyId: null };
  try { S.companyId = window.localStorage.getItem('acct_company'); } catch (e) { S.companyId = null; }
  var CO_COLORS = ['#0f6e66', '#7a4bb3', '#b4541a', '#1f5fa8', '#8a6d00', '#a02c55'];
  var store = {
    get: function (k) { try { return window.sessionStorage.getItem(k); } catch (e) { return null; } },
    set: function (k, v) { try { window.sessionStorage.setItem(k, v); } catch (e) { /* 無法使用時只存在記憶體 */ } },
    del: function (k) { try { window.sessionStorage.removeItem(k); } catch (e) { /* 忽略 */ } }
  };
  // 每個瀏覽器一個識別碼，登入錯誤次數依瀏覽器計算
  var clientId = (function () {
    var id = null;
    try { id = window.localStorage.getItem('acct_cid'); } catch (e) { id = null; }
    if (!id) {
      id = 'c' + Math.random().toString(36).slice(2) + Date.now().toString(36);
      try { window.localStorage.setItem('acct_cid', id); } catch (e) { /* 無法保存時每次重新產生 */ }
    }
    return id;
  })();
  function $(sel, root) { return (root || document).querySelector(sel); }
  function $all(sel, root) { return Array.prototype.slice.call((root || document).querySelectorAll(sel)); }
  function esc(s) {
    return String(s === null || s === undefined ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function fmt(n) {
    n = Number(n) || 0;
    var s = Math.abs(n).toLocaleString('zh-TW');
    return n < 0 ? '-' + s : s;
  }
  function money(n) { return '<span class="' + (Number(n) < 0 ? 'neg' : '') + '">' + fmt(n) + '</span>'; }
  function amt(v) {
    if (v === '' || v === null || v === undefined) return 0;
    var n = Number(String(v).replace(/[,\s]/g, ''));
    return isFinite(n) ? n : NaN;
  }
  function pct(n, base) { return base ? (Math.round(n / base * 1000) / 10).toFixed(1) + '%' : ''; }
  function can(a) { return !!(S.boot && S.boot.allowed.indexOf(a) >= 0); }

  // 日期
  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function daysIn(y, m) { return new Date(Date.UTC(y, m, 0)).getUTCDate(); }
  function monthEnd(p) { return p + '-' + pad(daysIn(+p.slice(0, 4), +p.slice(5, 7))); }
  function addMonths(p, n) {
    var y = +p.slice(0, 4), m = +p.slice(5, 7) + n;
    while (m < 1) { m += 12; y--; }
    while (m > 12) { m -= 12; y++; }
    return y + '-' + pad(m);
  }
  function today() { return S.boot ? S.boot.today : new Date().toISOString().slice(0, 10); }
  function fyStart(d) {
    var sm = (S.boot && S.boot.settings.fyStartMonth) || 1;
    var y = +d.slice(0, 4), m = +d.slice(5, 7);
    if (m < sm) y--;
    return y + '-' + pad(sm) + '-01';
  }
  function quickRange(kind) {
    var t = today(), p = t.slice(0, 7);
    if (kind === 'thisMonth') return { from: p + '-01', to: monthEnd(p) };
    if (kind === 'lastMonth') { var lp = addMonths(p, -1); return { from: lp + '-01', to: monthEnd(lp) }; }
    var fs = fyStart(t);
    if (kind === 'thisYear') { var fe = addMonths(fs.slice(0, 7), 11); return { from: fs, to: monthEnd(fe) }; }
    if (kind === 'lastYear') { var ls = addMonths(fs.slice(0, 7), -12); return { from: ls + '-01', to: monthEnd(addMonths(ls, 11)) }; }
    return null;
  }

  // ───────────── 與伺服器溝通 ─────────────
  var busyCount = 0;
  function busy(on) {
    busyCount += on ? 1 : -1;
    if (busyCount < 0) busyCount = 0;
    $('#busy').hidden = busyCount === 0;
  }
  function rpc(fn) {
    var args = Array.prototype.slice.call(arguments, 1);
    return new Promise(function (resolve, reject) {
      var runner = google.script.run.withSuccessHandler(resolve).withFailureHandler(function (e) {
        reject(new Error(e && e.message ? e.message : '連線失敗，請稍後再試'));
      });
      runner[fn].apply(runner, args);
    });
  }
  function call(action, payload) {
    busy(true);
    payload = Object.assign({}, payload || {});
    if (S.companyId) payload._company = S.companyId;
    return rpc('api', S.token, action, payload).then(function (r) {
      busy(false);
      if (!r.ok) {
        if (r.relogin) showLogin(r.error);
        if (r.switchCompany) { S.companyId = null; store.del('acct_company'); start(); }
        throw new Error(r.error);
      }
      return r.data;
    }, function (e) { busy(false); throw e; });
  }

  var toastTimer = null;
  function toast(msg, bad) {
    var t = $('#toast');
    t.textContent = msg;
    t.className = 'toast' + (bad ? ' bad' : '');
    t.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.hidden = true; }, bad ? 6000 : 3000);
  }

  // ───────────── 對話框 ─────────────
  var lastFocus = null;
  function openModal(title, html, opts) {
    opts = opts || {};
    lastFocus = document.activeElement;
    $('#modalTitle').textContent = title;
    $('#modalBody').innerHTML = html;
    $('.modal-card').className = 'modal-card' + (opts.narrow ? ' narrow' : '');
    $('#modal').hidden = false;
    var first = $('#modalBody input, #modalBody select, #modalBody textarea, #modalBody button');
    if (first) first.focus();
    return $('#modalBody');
  }
  function closeModal() {
    $('#modal').hidden = true;
    $('#modalBody').innerHTML = '';
    if (lastFocus && lastFocus.focus) lastFocus.focus();
  }
  /** 確認或輸入框；回傳 Promise：取消為 null，確認為 true 或輸入文字 */
  function ask(title, message, opts) {
    opts = opts || {};
    return new Promise(function (resolve) {
      var body = openModal(title,
        '<p>' + esc(message).replace(/\n/g, '<br>') + '</p>' +
        (opts.input ? '<label>' + esc(opts.input) + '<input id="askInput" autocomplete="off"></label>' : '') +
        '<p class="error-text" id="askErr"></p>' +
        '<div class="modal-foot"><button class="btn" type="button" id="askCancel">取消</button>' +
        '<button class="btn ' + (opts.danger ? 'danger' : 'primary') + '" type="button" id="askOk">' + esc(opts.okText || '確定') + '</button></div>',
        { narrow: true });
      var done = function (v) { closeModal(); resolve(v); };
      $('#askCancel', body).onclick = function () { done(null); };
      $('#askOk', body).onclick = function () {
        if (opts.input) {
          var v = $('#askInput', body).value.trim();
          if (!v) { $('#askErr', body).textContent = '請填寫' + opts.input; return; }
          done(v);
        } else done(true);
      };
      if (opts.input) $('#askInput', body).focus(); else $('#askOk', body).focus();
    });
  }
  function showTempPassword(username, pw) {
    var body = openModal('臨時密碼',
      '<p>帳號 <b>' + esc(username) + '</b> 的臨時密碼如下，<b>只會顯示這一次</b>。請私下交給本人，並請對方登入後立即變更密碼。</p>' +
      '<div class="pw-box">' + esc(pw) + '</div>' +
      '<div class="modal-foot"><button class="btn primary" type="button" id="pwOk">我已記下</button></div>', { narrow: true });
    $('#pwOk', body).onclick = closeModal;
  }

  // ───────────── 登入 ─────────────
  function showLogin(msg) {
    S.token = null;
    store.del('acct_token');
    $('#app').hidden = true;
    $('#login').hidden = false;
    $('#loginMsg').textContent = msg || '';
    closeModal();
    $('#loginUser').focus();
  }
  $('#loginForm').addEventListener('submit', function (ev) {
    ev.preventDefault();
    var btn = $('#loginBtn');
    btn.disabled = true;
    $('#loginMsg').textContent = '';
    busy(true);
    rpc('login', $('#loginUser').value.trim(), $('#loginPass').value, clientId).then(function (r) {
      busy(false);
      btn.disabled = false;
      if (!r.ok) { $('#loginMsg').textContent = r.error; return; }
      S.token = r.data.token;
      store.set('acct_token', S.token);
      $('#loginPass').value = '';
      start();
    }, function (e) { busy(false); btn.disabled = false; $('#loginMsg').textContent = e.message; });
  });
  $('#logoutBtn').addEventListener('click', function () {
    var t = S.token;
    showLogin('已登出');
    rpc('logout', t).catch(function () { /* 忽略 */ });
  });

  function applyBoot(b) {
    S.boot = b;
    S.acctMap = {};
    b.accounts.forEach(function (a) { S.acctMap[a.code] = a; });
    S.companyId = b.company.id;
    try { window.localStorage.setItem('acct_company', S.companyId); } catch (e) { /* 忽略 */ }
    var me = b.companies.filter(function (c) { return c.id === b.company.id; })[0] || { color: 0 };
    document.documentElement.style.setProperty('--co', coColor(me.color));
    $('#companyTitle').textContent = b.company.name || b.settings.companyName || b.app.name;
    var multi = b.companies.length > 1;
    $('#app').classList.toggle('multi', multi);
    $('#coWrap').hidden = !multi;
    $('#coSwitch').innerHTML = b.companies.map(function (c) {
      return '<option value="' + esc(c.id) + '"' + (c.id === b.company.id ? ' selected' : '') + '>' + esc(c.name) + '</option>';
    }).join('');
    $('#whoName').textContent = b.user.name || b.user.username;
    $('#whoRole').textContent = (b.user.groupRole === '管理者' ? '集團管理者' : b.user.role);
    document.title = b.company.name + '｜' + b.app.name;
  }
  function coColor(i) { return CO_COLORS[(Number(i) || 0) % CO_COLORS.length]; }
  function coName() { return S.boot ? S.boot.company.name : ''; }
  $('#coSwitch').addEventListener('change', function () {
    S.companyId = $('#coSwitch').value;
    var page = S.page;
    refreshBoot().then(function () { buildNav(); go(page); toast('已切換到 ' + coName()); }).catch(function (e) { toast(e.message, true); });
  });
  function refreshBoot() { return call('bootstrap').then(applyBoot); }

  function buildNav() {
    var html = '';
    var pendingGroup = null;
    PAGES.forEach(function (p) {
      if (p.group) { pendingGroup = p.group; return; }
      if (p.need && !can(p.need)) return;
      if (pendingGroup) { html += '<div class="nav-group">' + esc(pendingGroup) + '</div>'; pendingGroup = null; }
      html += '<a href="#" data-page="' + p.id + '">' + esc(p.title) + '</a>';
    });
    $('#nav').innerHTML = html;
    $all('#nav a').forEach(function (a) {
      a.addEventListener('click', function (ev) { ev.preventDefault(); go(a.getAttribute('data-page')); });
    });
  }

  function start() {
    call('bootstrap').then(function (b) {
      applyBoot(b);
      $('#login').hidden = true;
      $('#app').hidden = false;
      buildNav();
      go('home');
    }).catch(function (e) { showLogin(e.message); });
  }

  $('#menuBtn').addEventListener('click', function () {
    var open = !$('#nav').classList.contains('open');
    $('#nav').classList.toggle('open', open);
    $('#menuBtn').setAttribute('aria-expanded', String(open));
  });
  $('#modalClose').addEventListener('click', closeModal);
  document.addEventListener('keydown', function (ev) {
    if (ev.key === 'Escape' && !$('#modal').hidden) closeModal();
  });

  function go(id) {
    var page = PAGES.filter(function (p) { return p.id === id; })[0] || PAGES[1];
    if (page.need && !can(page.need)) page = PAGES[1];
    S.page = page.id;
    $all('#nav a').forEach(function (a) { a.classList.toggle('active', a.getAttribute('data-page') === page.id); });
    $('#nav').classList.remove('open');
    $('#menuBtn').setAttribute('aria-expanded', 'false');
    var main = $('#main');
    main.innerHTML = '<div class="page-head"><h2>' + esc(page.title) + '</h2></div><div id="pageBody"><p class="muted">載入中…</p></div>';
    var body = $('#pageBody');
    Promise.resolve().then(function () { return RENDER[page.id](body, main); }).catch(function (e) {
      body.innerHTML = '<div class="notice bad">' + esc(e.message) + '</div>';
    });
    main.focus();
    window.scrollTo(0, 0);
  }
  function setHeadActions(main, html) {
    var head = $('.page-head', main);
    var div = document.createElement('div');
    div.className = 'row no-print';
    div.innerHTML = html;
    head.appendChild(div);
    return div;
  }

  // 科目選單
  function acctOptions(filter) {
    return S.boot.accounts.filter(function (a) { return a.enabled && (!filter || filter(a)); })
      .sort(function (a, b) { return a.code < b.code ? -1 : 1; })
      .map(function (a) { return '<option value="' + esc(a.code + ' ' + a.name) + '"></option>'; }).join('');
  }
  function parseAcct(v) {
    v = String(v || '').trim();
    if (!v) return '';
    var first = v.split(/\s+/)[0];
    if (S.acctMap[first]) return first;
    var byName = S.boot.accounts.filter(function (a) { return a.name === v; })[0];
    return byName ? byName.code : first;
  }
  function acctLabel(code) { var a = S.acctMap[code]; return a ? a.code + ' ' + a.name : code; }

  function rangeControls(el, init, onRun, opts) {
    opts = opts || {};
    var chips = opts.asOf
      ? [['today', '今天'], ['lastMonthEnd', '上月底'], ['lastYearEnd', '上年度底']]
      : [['thisMonth', '本月'], ['lastMonth', '上月'], ['thisYear', '本年度'], ['lastYear', '上年度']];
    el.innerHTML = '<div class="toolbar no-print">' +
      '<div class="chips">' + chips.map(function (c) { return '<button type="button" class="chip" data-q="' + c[0] + '">' + c[1] + '</button>'; }).join('') + '</div>' +
      (opts.asOf
        ? '<label class="field">截至日期<input type="date" class="asof" value="' + esc(init.asOf) + '"></label>'
        : '<label class="field">起<input type="date" class="from" value="' + esc(init.from) + '"></label><label class="field">迄<input type="date" class="to" value="' + esc(init.to) + '"></label>') +
      (opts.extra || '') +
      '<button type="button" class="btn primary run">查詢</button></div>';
    var run = function () {
      if (opts.asOf) onRun({ asOf: $('.asof', el).value });
      else onRun({ from: $('.from', el).value, to: $('.to', el).value });
    };
    $all('.chip', el).forEach(function (b) {
      b.onclick = function () {
        var q = b.getAttribute('data-q');
        if (opts.asOf) {
          var t = today();
          var v = q === 'today' ? t : q === 'lastMonthEnd' ? monthEnd(addMonths(t.slice(0, 7), -1)) : (function () { var fs = fyStart(t); return monthEnd(addMonths(fs.slice(0, 7), -1)); })();
          $('.asof', el).value = v;
        } else {
          var r = quickRange(q);
          $('.from', el).value = r.from; $('.to', el).value = r.to;
        }
        run();
      };
    });
    $('.run', el).onclick = run;
    run();
  }

  // ───────────── 各頁面 ─────────────
  var RENDER = {};

  RENDER.home = function (el) {
    if (!can('dashboard')) {
      el.innerHTML = '<div class="card"><p>您好，' + esc(S.boot.user.name) + '。</p><p>您可以在「傳票」查看已登錄的傳票，在「日記簿」依日期查看分錄。</p>' +
        '<button class="btn primary" type="button" id="goV">查看傳票</button></div>';
      $('#goV').onclick = function () { go('vouchers'); };
      return;
    }
    return call('dashboard').then(function (d) {
      var st = S.boot.settings;
      var html = '';
      if (S.boot.user.role === '管理者') {
        var steps = [
          { done: !!(st.companyName && st.openingDate), text: '到「公司設定」填公司名稱、產業類別與開帳日', page: 'settings' },
          { done: S.boot.accounts.length > 0, text: '到「會計科目」依產業帶入建議科目，再增刪成自己的科目表', page: 'accounts' },
          { done: d.openingCount > 0 && d.openingBalanced, text: '到「期初餘額」輸入開帳日當天的資產、負債、權益餘額', page: 'opening' },
          { done: d.voucherCount > 0, text: '到「傳票」開始記帳；月底到「月底盤點」輸入存貨', page: 'vouchers' }
        ];
        if (steps.some(function (s) { return !s.done; })) {
          html += '<div class="card"><h3 style="margin-top:0">開始使用的四個步驟</h3><ol class="steps">' + steps.map(function (s) {
            return '<li class="' + (s.done ? 'done' : '') + '"><a href="#" data-go="' + s.page + '">' + esc(s.text) + '</a></li>';
          }).join('') + '</ol></div>';
        }
      }
      if (d.openingCount > 0 && !d.openingBalanced) html += '<div class="notice bad">期初餘額借貸不平衡，資產負債表會對不上。請到「期初餘額」修正。</div>';
      if (!d.balanced) html += '<div class="notice bad">試算表借貸不平衡，請檢查期初餘額。</div>';
      var m = d.month, y = d.ytd;
      html += '<h3>' + esc(d.period) + ' 本月</h3><div class="kpis">' +
        kpi('營業收入', m.revenue, '') +
        kpi('營業成本', m.cost, d.stocktaken ? (m.revenue ? '毛利率 ' + pct(m.grossProfit, m.revenue) : '') : '本月尚未盤點，目前＝本月進貨') +
        kpi('營業費用', m.opex, '') +
        kpi('本月淨利', m.netIncome, '本月傳票 ' + d.voucherCount + ' 張') +
        '</div><h3>本年度與資金</h3><div class="kpis">' +
        kpi('本年度營收', y.revenue, '') +
        kpi('本年度淨利', y.netIncome, y.revenue ? '淨利率 ' + pct(y.netIncome, y.revenue) : '') +
        kpi('現金及銀行存款', d.cash, '含零用金、電子支付') +
        kpi('本月狀態', null, d.locked[d.period] ? '已鎖帳' : '尚未鎖帳', d.locked[d.period] ? '已鎖帳' : '開放中') +
        '</div>';
      el.innerHTML = html;
      $all('[data-go]', el).forEach(function (a) { a.onclick = function (ev) { ev.preventDefault(); go(a.getAttribute('data-go')); }; });
    });
    function kpi(label, value, sub, text) {
      return '<div class="kpi"><div class="label">' + esc(label) + '</div><div class="value">' + (text ? esc(text) : money(value)) + '</div><div class="sub">' + esc(sub || '') + '</div></div>';
    }
  };

  // ── 傳票 ──
  RENDER.vouchers = function (el, main) {
    if (can('saveVoucher')) {
      var actions = setHeadActions(main, '<button class="btn primary" type="button" id="newV">＋ 新增傳票</button>');
      $('#newV', actions).onclick = function () { voucherEditor(null, load); };
    }
    el.innerHTML = '<div class="toolbar"><label class="field">月份<input type="month" id="vMonth" value="' + today().slice(0, 7) + '"></label>' +
      '<label class="grow">搜尋（號碼、科目、摘要、往來對象）<input id="vKw" placeholder="例如：租金"></label>' +
      '<button class="btn" type="button" id="vGo">查詢</button></div><div id="vList"></div>';
    $('#vGo').onclick = load;
    $('#vKw').addEventListener('keydown', function (ev) { if (ev.key === 'Enter') load(); });
    function load() {
      return call('listVouchers', { period: $('#vMonth').value, keyword: $('#vKw').value }).then(function (r) {
        var list = $('#vList');
        if (!r.vouchers.length) { list.innerHTML = '<div class="card muted">' + esc(r.period) + ' 沒有傳票。</div>'; return; }
        list.innerHTML = r.vouchers.map(function (v, i) {
          var isVoid = v.status === '作廢';
          var locked = S.boot.lockedPeriods[v.date.slice(0, 7)];
          return '<div class="voucher" data-i="' + i + '"><div class="voucher-head" role="button" tabindex="0" aria-expanded="false">' +
            '<span class="no">' + esc(v.no) + '</span><span>' + esc(v.date) + '</span><span class="muted">' + esc(v.type) + '</span>' +
            '<span class="memo">' + esc(v.memo) + '</span><span class="num">' + fmt(v.debit) + '</span>' +
            (isVoid ? '<span class="badge void">作廢</span>' : '') + (v.source === '月底盤點' ? '<span class="badge auto">月底盤點</span>' : '') +
            (locked ? '<span class="badge lock">已鎖帳</span>' : '') + '</div>' +
            '<div class="voucher-body" hidden><div class="table-wrap"><table><thead><tr><th>科目</th><th class="num">借方</th><th class="num">貸方</th><th>摘要</th><th>往來對象</th></tr></thead><tbody>' +
            v.lines.map(function (l) { return '<tr class="' + (isVoid ? 'void' : '') + '"><td><span class="code">' + esc(l.code) + '</span> ' + esc(l.name) + '</td><td class="num">' + (l.debit ? fmt(l.debit) : '') + '</td><td class="num">' + (l.credit ? fmt(l.credit) : '') + '</td><td>' + esc(l.memo) + '</td><td>' + esc(l.party) + '</td></tr>'; }).join('') +
            '</tbody></table></div><div class="voucher-actions">' +
            (!isVoid && !locked && v.source !== '月底盤點' && can('saveVoucher') ? '<button class="btn small" type="button" data-act="edit">修改</button>' : '') +
            (!isVoid && !locked && can('saveVoucher') ? '<button class="btn small" type="button" data-act="copy">複製成新傳票</button>' : '') +
            (!isVoid && !locked && v.source !== '月底盤點' && can('voidVoucher') ? '<button class="btn small danger" type="button" data-act="void">作廢</button>' : '') +
            '</div></div></div>';
        }).join('');
        $all('.voucher', list).forEach(function (card) {
          var v = r.vouchers[+card.getAttribute('data-i')];
          var head = $('.voucher-head', card), body = $('.voucher-body', card);
          var toggle = function () { body.hidden = !body.hidden; head.setAttribute('aria-expanded', String(!body.hidden)); };
          head.onclick = toggle;
          head.onkeydown = function (ev) { if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); toggle(); } };
          $all('[data-act]', card).forEach(function (b) {
            b.onclick = function () {
              var act = b.getAttribute('data-act');
              if (act === 'edit') voucherEditor(v, load);
              if (act === 'copy') voucherEditor({ date: today(), type: v.type, memo: v.memo, lines: v.lines }, load, true);
              if (act === 'void') ask('作廢傳票 ' + v.no, '作廢後傳票會保留紀錄但不再計入帳上，號碼不會重複使用。', { input: '作廢原因', okText: '作廢', danger: true }).then(function (reason) {
                if (!reason) return;
                call('voidVoucher', { no: v.no, reason: reason }).then(function () { toast('已作廢 ' + v.no); load(); }).catch(function (e) { toast(e.message, true); });
              });
            };
          });
        });
      }).catch(function (e) { $('#vList').innerHTML = '<div class="notice bad">' + esc(e.message) + '</div>'; });
    }
    return load();
  };

  function voucherEditor(v, onSaved, isCopy) {
    var editing = v && v.no && !isCopy;
    var title = (editing ? '修改傳票 ' + v.no : '新增傳票') + '｜' + coName();
    var tpls = (!editing && S.boot.templates) ? S.boot.templates : [];
    var body = openModal(title,
      '<datalist id="acctList">' + acctOptions() + '</datalist>' +
      (tpls.length ? '<div class="tpl-bar"><label class="grow">常用範本（選了會自動帶科目）<select id="edTpl"><option value="">（不套用，自己輸入）</option>' +
        tpls.map(function (t) { return '<option value="' + esc(t.id) + '">' + esc(t.name) + '</option>'; }).join('') + '</select></label>' +
        '<label class="field" id="edAmtWrap" hidden><span id="edAmtLabel">含稅金額</span><input id="edAmt" class="num" inputmode="numeric" placeholder="例如 10500"></label>' +
        '<p class="muted small" id="edTplHint" style="flex-basis:100%;margin:0"></p></div>' : '') +
      '<div class="row"><label class="field">日期<input type="date" id="edDate" value="' + esc(v ? v.date : today()) + '"></label>' +
      '<label class="field">類型<select id="edType">' + S.boot.voucherTypes.map(function (t) { return '<option' + (v && v.type === t ? ' selected' : '') + '>' + t + '</option>'; }).join('') + '</select></label>' +
      '<label class="grow">摘要<input id="edMemo" value="' + esc(v ? v.memo : '') + '" placeholder="例如：一月份店租"></label></div>' +
      '<h3>分錄</h3><div class="lines" id="edLines"><div class="line head"><span>科目</span><span>借方</span><span>貸方</span><span>摘要（空白＝同上）</span><span>往來對象</span><span></span></div></div>' +
      '<div class="line-totals"><button class="btn small" type="button" id="edAdd">＋ 加一行</button><span>借方合計 <b id="edDr">0</b></span><span>貸方合計 <b id="edCr">0</b></span><span id="edDiff"></span></div>' +
      '<p class="error-text" id="edErr" role="alert"></p>' +
      '<div class="modal-foot"><button class="btn" type="button" id="edCancel">取消</button><button class="btn primary" type="button" id="edSave">儲存</button></div>');
    var linesEl = $('#edLines', body);
    function addLine(l) {
      l = l || {};
      var row = document.createElement('div');
      row.className = 'line';
      row.setAttribute('data-part', l.part || '');
      row.setAttribute('data-side', l.side || '');
      row.innerHTML = '<div class="acct"><input list="acctList" class="l-acct" aria-label="科目" placeholder="輸入代碼或名稱" value="' + esc(l.code ? acctLabel(l.code) : '') + '"><div class="acct-name"></div></div>' +
        '<input class="l-dr num" inputmode="numeric" aria-label="借方" placeholder="借方" value="' + (l.debit ? l.debit : '') + '">' +

      linesEl.appendChild(row);

      var showName = function () {
        var code = parseAcct(acct.value);
        var a = S.acctMap[code];
        $('.acct-name', row).textContent = acct.value ? (a ? (a.enabled ? a.block : '已停用') : '找不到此科目') : '';
        if (a && acct.value !== a.code + ' ' + a.name) acct.value = a.code + ' ' + a.name;
      };
      acct.addEventListener('change', showName);
      showName();
      $('.l-dr', row).addEventListener('input', totals);
      $('.l-cr', row).addEventListener('input', totals);

    function collect() {
      return $all('.line:not(.head)', linesEl).map(function (row) {
        return { code: parseAcct($('.l-acct', row).value), debit: amt($('.l-dr', row).value), credit: amt($('.l-cr', row).value), memo: $('.l-memo', row).value.trim(), party: $('.l-party', row).value.trim() };
      });
    }
    function totals() {
      var dr = 0, cr = 0;
      collect().forEach(function (l) { dr += l.debit || 0; cr += l.credit || 0; });
      $('#edDr', body).textContent = fmt(dr);
      $('#edCr', body).textContent = fmt(cr);
      var d = $('#edDiff', body);
      if (dr === cr && dr > 0) { d.textContent = '借貸平衡'; d.className = 'diff-ok'; }
      else if (dr || cr) { d.textContent = '差額 ' + fmt(dr - cr); d.className = 'diff-bad'; }
      else { d.textContent = ''; d.className = ''; }
      return dr - cr;
    }
    (v && v.lines && v.lines.length ? v.lines : [{}, {}]).forEach(addLine);
    totals();
    body.addEventListener('input', function () { $('#edErr', body).textContent = ''; });
    $('#edAdd', body).onclick = function () {
      var diff = totals();
      var row = addLine(diff > 0 ? { credit: diff } : diff < 0 ? { debit: -diff } : {});
      $('.l-acct', row).focus();
      totals();
    };
    // 套用範本
    var tplSel = $('#edTpl', body);
    var currentTpl = null;
    function fillAmounts() {
      if (!currentTpl || currentTpl.amountMode === 'manual') return;
      var total = amt($('#edAmt', body).value);
      if (isNaN(total)) return;
      var net = currentTpl.amountMode === 'tax' ? Math.round(total / 1.05) : total;
      var tax = currentTpl.amountMode === 'tax' ? total - net : 0;
      $all('.line:not(.head)', linesEl).forEach(function (row) {
        var part = row.getAttribute('data-part'), side = row.getAttribute('data-side');
        if (!part) return;
        var val = part === 'total' ? total : part === 'net' ? net : tax;
        $('.l-dr', row).value = side === 'D' && val ? val : '';
        $('.l-cr', row).value = side === 'C' && val ? val : '';
      });
      $('#edTplHint', body).textContent = currentTpl.amountMode === 'tax' && total ? '未稅 ' + fmt(net) + '，稅額 ' + fmt(tax) + '（5%）' : '';
      totals();
    }
    if (tplSel) {
      tplSel.onchange = function () {
        currentTpl = tpls.filter(function (t) { return t.id === tplSel.value; })[0] || null;
        $('#edAmtWrap', body).hidden = !currentTpl || currentTpl.amountMode === 'manual';
        $('#edTplHint', body).textContent = currentTpl && currentTpl.amountMode === 'manual' ? '這個範本的金額請在下方各行自己填。' : '';
        if (!currentTpl) return;
        $('#edAmtLabel', body).textContent = currentTpl.amountMode === 'tax' ? '含稅金額' : '金額';
        $('#edType', body).value = currentTpl.type;
        $('#edMemo', body).value = currentTpl.memo;
        $all('.line:not(.head)', linesEl).forEach(function (row) { row.remove(); });
        currentTpl.lines.forEach(function (l) { addLine({ code: l.code, part: l.part, side: l.side }); });
        fillAmounts();
        var a = $('#edAmt', body);
        if (!$('#edAmtWrap', body).hidden) a.focus();
      };
      $('#edAmt', body).addEventListener('input', fillAmounts);
    }
    $('#edCancel', body).onclick = closeModal;
    $('#edSave', body).onclick = function () {
      var lines = collect().filter(function (l) { return l.code || l.debit || l.credit; });
      var payload = { no: editing ? v.no : '', date: $('#edDate', body).value, type: $('#edType', body).value, memo: $('#edMemo', body).value.trim(), lines: lines };
      $('#edErr', body).textContent = '';

        closeModal();
        toast((editing ? '已修改 ' : '已新增 ') + r.no);
        if (onSaved) onSaved();
      }).catch(function (e) { $('#edErr', body).textContent = e.message; });
    };
  }

  // ── 期初餘額 ──
  RENDER.opening = function (el) {
    return call('getOpening').then(function (r) {
      if (!r.openingDate) {
        el.innerHTML = '<div class="notice warn">請先到「公司設定」填寫開帳日，再輸入期初餘額。</div>';

      }
      var editable = can('saveOpening') && !r.locked;

        (r.locked ? '<div class="notice warn">開帳日所在月份已鎖帳，只能查看。</div>' : '') +
        '<div class="card"><div class="table-wrap"><table><thead><tr><th>科目</th><th class="num">借方</th><th class="num">貸方</th></tr></thead><tbody>';

          return '<tr data-code="' + esc(x.code) + '"><td class="indent"><span class="code">' + esc(x.code) + '</span> ' + esc(x.name) + (x.normal === '貸' && /資產/.test(b) ? ' <span class="muted small">（抵銷）</span>' : '') + '</td>' +
            '<td class="num"><input class="num op-dr" inputmode="numeric" aria-label="' + esc(x.name) + ' 借方" value="' + (x.debit || '') + '"' + (editable ? '' : ' disabled') + ' style="max-width:150px"></td>' +
            '<td class="num"><input class="num op-cr" inputmode="numeric" aria-label="' + esc(x.name) + ' 貸方" value="' + (x.credit || '') + '"' + (editable ? '' : ' disabled') + ' style="max-width:150px"></td></tr>';
        }).join('');
      });
      html += '<tr class="total"><td>合計</td><td class="num" id="opDr"></td><td class="num" id="opCr"></td></tr></tbody></table></div>' +
        '<p id="opDiff"></p>' + (editable ? '<div class="modal-foot"><button class="btn primary" type="button" id="opSave">儲存期初餘額</button></div>' : '') + '</div>';

        var dr = 0, cr = 0;

        $('#opCr').textContent = fmt(cr);

      };

      upd();

        }).catch(function (e) { toast(e.message, true); });
      };

  // ── 集團報表 ──
  RENDER.group = function (el, main) {
    var type = 'is';
    el.innerHTML = '<div class="chips" style="margin-bottom:12px" role="tablist"><button class="chip on" type="button" data-t="is">損益表</button><button class="chip" type="button" data-t="bs">資產負債表</button></div><div id="gCtl"></div><div id="gOut"></div>';
    setHeadActions(main, '<button class="btn" type="button" id="gPrint">列印</button>');
    $('#gPrint').onclick = function () { window.print(); };
    $all('[data-t]', el).forEach(function (b) {
      b.onclick = function () { type = b.getAttribute('data-t'); $all('[data-t]', el).forEach(function (x) { x.classList.toggle('on', x === b); }); draw(); };
    });
    function draw() {
      var ctl = $('#gCtl');
      if (type === 'is') rangeControls(ctl, quickRange('thisMonth'), run);
      else rangeControls(ctl, { asOf: today() }, run, { asOf: true });
    }
    function run(p) {
      p.type = type;
      call('consolidated', p).then(function (r) {
        var cos = r.companies;
        var head = '<tr><th>項目</th>' + cos.map(function (c) { return '<th class="num">' + esc(c.name) + '</th>'; }).join('') + '<th class="num">合併</th></tr>';
        var cell = function (m, total) { return cos.map(function (c) { return '<td class="num">' + (c.empty ? '<span class="muted">—</span>' : money(m[c.id] || 0)) + '</td>'; }).join('') + '<td class="num"><b>' + money(total) + '</b></td>'; };
        var sm = r.summary;
        var sumRow = function (label, key, cls) { var m = sm[key] || { total: 0 }; return '<tr class="' + (cls || 'subtotal') + '"><td>' + label + '</td>' + cell(m, m.total) + '</tr>'; };
        var rows = '';
        var after = r.type === 'is'
          ? { '營業成本': ['營業毛利', 'grossProfit'], '營業費用': ['營業淨利', 'operatingIncome'], '營業外支出': ['稅前淨利', 'pretaxIncome'], '所得稅費用': ['本期淨利', 'netIncome', 'total'] }
          : { '非流動資產': ['資產總計', 'assets', 'total'], '非流動負債': ['負債總計', 'liabilities'], '權益': ['負債及權益總計', 'liabilitiesAndEquity', 'total'] };
        r.sections.forEach(function (sec) {
          if (sec.rows.length || sec.block === '營業收入') {
            rows += '<tr class="section"><td colspan="' + (cos.length + 2) + '">' + esc(sec.block) + '</td></tr>' +
              sec.rows.map(function (x) { return '<tr><td class="indent">' + (x.code ? '<span class="code">' + esc(x.code) + '</span> ' : '') + esc(x.name) + '</td>' + cell(x.amounts, x.total) + '</tr>'; }).join('') +
              '<tr class="subtotal"><td>' + esc(sec.block) + '合計</td>' + cell(sec.totals, sec.total) + '</tr>';
          }
          var a = after[sec.block];
          if (a) rows += sumRow(a[0], a[1], a[2]);
        });
        var notes = cos.filter(function (c) { return c.empty; }).map(function (c) { return c.name + '：' + c.note; });
        var range = r.type === 'is' ? (p.from + ' ～ ' + p.to) : ('截至 ' + p.asOf);
        $('#gOut').innerHTML = (notes.length ? '<div class="notice warn">' + esc(notes.join('；')) + '</div>' : '') +
          (r.type === 'bs' && sm.difference && sm.difference.total ? '<div class="notice bad">合併後資產與負債＋權益相差 ' + fmt(sm.difference.total) + '，請檢查各公司期初餘額。</div>' : '') +
          '<div class="card"><div class="report-title"><div class="co">集團' + (r.type === 'is' ? '損益表' : '資產負債表') + '</div><div class="rng">' + esc(range) + '</div></div>' +
          '<div class="table-wrap"><table><thead>' + head + '</thead><tbody>' + rows + '</tbody></table></div>' +
          '<p class="muted small">合併欄為各公司直接加總，尚未沖銷公司間往來（例如公版食品賣給公版餐飲的貨款），合併營收與往來科目可能重複計算。</p></div>';
      }).catch(function (e) { $('#gOut').innerHTML = '<div class="notice bad">' + esc(e.message) + '</div>'; });
    }
    draw();
  };

      if (role === '管理者') {
        h += '<h3>管理者第一次設定</h3><ol><li>「公司設定」：公司名稱、產業類別、營業稅類型、開帳日。</li><li>「會計科目」→「科目參考庫」→「依公司產業一次加入建議科目」，再停用用不到的、新增自訂科目。</li>' +
          '<li>「期初餘額」：輸入開帳日當天的資產、負債、權益餘額（借貸要平衡）。</li><li>「帳號與權限」（集團管理者）：幫會計、助理開帳號並指派公司，臨時密碼只顯示一次。</li></ol>' +
          '<h3>忘記密碼</h3><ul><li>其他人忘記：集團管理者在「帳號與權限」按「重設密碼」。</li><li>管理者自己忘記：打開試算表 → 上方選單「公版會計系統」→「重設 admin 密碼」。</li></ul>';
      }
    }
    h += '</div>';
    el.innerHTML = h;
  };

  // ───────────── 啟動 ─────────────
  var saved = store.get('acct_token');
  if (saved) { S.token = saved; start(); } else showLogin('');
})();
</script>

</body>
</html>
